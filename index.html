<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8247f">
<title>Temp Mail — Premium</title>
<style>
:root{--tx:#33182a;--mut:#8f6b80;--pk:#e8247f;--pk2:#ff7ab5;--glass:rgba(255,255,255,.62);--gb:rgba(255,255,255,.85);--field:rgba(255,214,232,.45);--sh:rgba(220,70,140,.22);--bg:#fff0f7;--ok:#17b26a}
@media (prefers-color-scheme:dark){:root{--tx:#fdeaf4;--mut:#c79bb5;--glass:rgba(48,22,38,.62);--gb:rgba(255,255,255,.09);--field:rgba(255,255,255,.07);--sh:rgba(0,0,0,.5);--bg:#16080f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;color:var(--tx);background:var(--bg);overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.b1{width:300px;height:300px;background:#ff7ab5;top:-80px;left:-90px}
.b2{width:260px;height:260px;background:#c77dff;bottom:10%;right:-100px;animation-delay:-5s}
.b3{width:220px;height:220px;background:#ffb3d1;top:40%;left:-80px;animation-delay:-9s}
@keyframes fl{to{transform:translate(40px,60px) scale(1.15)}}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 50px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,var(--pk2),var(--pk));display:grid;place-items:center;box-shadow:0 10px 24px var(--sh)}
.logo svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2}
h1{font-size:20px;margin:0;line-height:1.1}
.crown{display:inline-block;margin-top:3px;font-size:9px;font-weight:800;letter-spacing:.16em;padding:3px 8px;border-radius:99px;color:#fff;background:linear-gradient(90deg,#e8247f,#a855f7)}
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gb);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:0 14px 34px var(--sh)}
.lab{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mut);margin-bottom:12px}
.live{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:0;padding:4px 10px;border-radius:99px;background:var(--field);color:var(--pk);font-weight:800}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pu 1.4s infinite}
.live.err i{background:#e11d48;animation:none}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(23,178,106,.6)}100%{box-shadow:0 0 0 8px rgba(23,178,106,0)}}
.row{display:flex;gap:10px;align-items:center}
.addr{flex:1;min-width:0;background:var(--field);border:1px solid var(--gb);border-radius:16px;padding:15px;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.95)}button:disabled{opacity:.55}
.copy{width:54px;height:54px;border-radius:16px;color:#fff;background:linear-gradient(145deg,var(--pk2),var(--pk));display:grid;place-items:center;box-shadow:0 10px 20px var(--sh)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:15px;border-radius:16px;font-weight:800;font-size:14px;background:var(--field);border:1px solid var(--gb)}
.btn.p{color:#fff;border:0;background:linear-gradient(135deg,#ff5fa2,#e8247f 55%,#b4239e);box-shadow:0 12px 24px var(--sh)}
.btn.d{color:var(--pk)}
.timer{display:flex;justify-content:space-between;align-items:center}
select{font:inherit;font-size:13px;font-weight:600;padding:10px 12px;border-radius:12px;border:1px solid var(--gb);background:var(--field);color:var(--tx)}
.time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--pk),#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:8px;border-radius:9px;background:var(--field);margin:14px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,var(--pk2),var(--pk),#a855f7);transition:width 1s linear}
.note{font-size:11px;color:var(--mut);line-height:1.4}
.ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800;font-size:16px}
.cnt{margin-left:8px;font-size:11px;padding:3px 9px;border-radius:99px;background:var(--field);color:var(--pk)}
.ico{width:40px;height:40px;border-radius:13px;background:var(--field);border:1px solid var(--gb);display:grid;place-items:center;color:var(--pk)}
.ico.spin svg{animation:sp .8s linear}
@keyframes sp{to{transform:rotate(360deg)}}
.search{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--gb);background:var(--field);color:var(--tx);font:inherit;font-size:13px;margin-bottom:12px;outline:0}
.msg{display:flex;gap:12px;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--field);border:1px solid var(--gb);margin-bottom:10px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.msg.new{box-shadow:inset 3px 0 0 var(--pk)}
.av{flex:none;width:40px;height:40px;border-radius:50%;color:#fff;font-weight:800;display:grid;place-items:center;background:linear-gradient(145deg,var(--pk2),var(--pk))}
.mb{min-width:0;flex:1}
.mt{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt span{font-size:11px;color:var(--mut);flex:none}
.sub{font-size:13px;font-weight:700;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{font-size:12px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.tg{font-size:10px;font-weight:800;padding:4px 9px;border-radius:8px;background:#fff1c2;color:#8a5a00}
.tg.l{background:#dbe9ff;color:#1d4fa8}.tg.n{background:#ffd9e8;color:#c01868}
.cc{font-size:12px;font-weight:800;padding:5px 11px;border-radius:9px;color:#fff;background:linear-gradient(135deg,var(--pk2),var(--pk));letter-spacing:.12em}
.empty{text-align:center;padding:28px 10px;color:var(--mut);font-size:12px;line-height:1.5}
.empty svg{width:70px;height:70px;stroke:var(--pk2);fill:none;stroke-width:1.4;margin-bottom:8px}
.empty b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#2b1a24;color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(20,5,12,.55);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:8}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;animation:up .3s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h3{margin:0 0 4px;font-size:17px}.meta{font-size:12px;color:var(--mut);margin-bottom:14px;word-break:break-all}
.sheet pre{font:inherit;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin:0}
.sheet a{color:var(--pk);font-weight:700}
.otp{font-size:32px;letter-spacing:.22em;font-weight:800;text-align:center;border-radius:18px;padding:16px;margin:4px 0 16px;color:#fff;background:linear-gradient(135deg,#ff5fa2,#e8247f 55%,#b4239e);box-shadow:0 12px 24px var(--sh);cursor:pointer}
.otp small{display:block;font-size:10px;letter-spacing:.1em;opacity:.85;margin-top:4px;font-weight:600}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></div>
    <div><h1>Temp Mail</h1><span class="crown">♛ PREMIUM</span></div>
  </div>

  <div class="card">
    <div class="lab">YOUR TEMPORARY EMAIL <span class="live" id="st"><i></i><span id="stt">Ready</span></span></div>
    <div class="row">
      <div class="addr" id="addr">No email yet</div>
      <button class="copy" id="copy" aria-label="Copy"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
    </div>
    <div class="btns">
      <button class="btn p" id="new">+ New Email</button>
      <button class="btn d" id="del">Delete</button>
    </div>
  </div>

  <div class="card">
    <div class="lab">SESSION TIMER</div>
    <div class="timer">
      <select id="dur"><option value="600">10 minutes</option><option value="1200">20 minutes</option><option value="3600">1 hour</option></select>
      <div class="time" id="time">10:00</div>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <div class="note">⏱ This countdown is a local reminder in your browser. It does not delete the address on any server.</div>
  </div>

  <div class="card">
    <div class="ih"><div>Inbox<span class="cnt" id="cnt">0</span></div><button class="ico" id="ref" aria-label="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button></div>
    <input class="search" id="q" placeholder="Search messages…">
    <div id="list"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const HOSTS=["https://api.mail.tm","https://api.mail.gw"];let API=HOSTS[0];
const $=id=>document.getElementById(id);
let acc=null,token="",msgs=[],seen=new Set(),poll=null,tick=null,total=600,left=600,busy=false;
const emptySvg='<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="m4 8 8 6 8-6"/></svg>';

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2000)}
function setSt(t,err){$("stt").textContent=t;$("st").classList.toggle("err",!!err)}
function rnd(n){const c="abcdefghijklmnopqrstuvwxyz0123456789";const a=new Uint32Array(n);crypto.getRandomValues(a);return[...a].map(x=>c[x%c.length]).join("")}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function copy(t,m){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m)).catch(()=>toast("Copy not supported"))}

async function api(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opt.headers||{})}});
  if(!r.ok)throw new Error(r.status);
  return r.status===204?null:r.json();
}

function draw(){$("time").textContent=fmt(Math.max(left,0));$("fill").style.width=Math.max(left,0)/total*100+"%"}
function startTimer(){clearInterval(tick);total=left=+$("dur").value;draw();tick=setInterval(()=>{left--;draw();if(left<=0){clearInterval(tick);toast("Session time is over")}},1000)}

function findOtp(t){
  t=t||"";
  let m=t.match(/(?:code|otp|pin|verification|কোড)[^0-9]{0,40}(\d{4,8})/i)||t.match(/\b(\d{6})\b/)||t.match(/\b(\d{4,8})\b/);
  return m?m[1]:null;
}
function findLink(t){const m=(t||"").match(/https?:\/\/[^\s<>"')]+/);return m?m[0]:null}
function ago(d){const s=Math.max(0,Math.floor((Date.now()-new Date(d))/1000));if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";return new Date(d).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}

function render(){
  const q=$("q").value.toLowerCase(),l=$("list");
  const f=msgs.filter(m=>((m.from||"")+(m.subject||"")+(m.intro||"")).toLowerCase().includes(q));
  $("cnt").textContent=msgs.length;
  if(!f.length){l.innerHTML='<div class="empty">'+emptySvg+'<b>'+(acc?"No messages yet":"No email yet")+'</b>'+(acc?"Waiting for incoming messages. This page checks automatically.":"Generate an address to start.")+'</div>';return}
  l.innerHTML="";
  f.forEach(m=>{
    const b=document.createElement("button");b.className="msg"+(m.isNew?" new":"");
    b.innerHTML='<div class="av"></div><div class="mb"><div class="mt"><b></b><span></span></div><div class="sub"></div><div class="pv"></div><div class="tags"></div></div>';
    b.querySelector(".av").textContent=(m.from||"?")[0].toUpperCase();
    b.querySelector("b").textContent=m.from;b.querySelector(".mt span").textContent=ago(m.createdAt);
    b.querySelector(".sub").textContent=m.subject||"(no subject)";b.querySelector(".pv").textContent=m.intro||"";
    const t=b.querySelector(".tags"),otp=findOtp((m.subject||"")+" "+(m.intro||""));
    if(otp){const c=document.createElement("span");c.className="cc";c.textContent=otp;c.onclick=e=>{e.stopPropagation();copy(otp,"Code copied")};t.append(c)}
    if(findLink(m.intro))t.insertAdjacentHTML("beforeend",'<span class="tg l">🔗 Link</span>');
    if(m.isNew)t.insertAdjacentHTML("beforeend",'<span class="tg n">New</span>');
    b.onclick=()=>openMsg(m);l.appendChild(b);
  });
}

async function openMsg(m){
  m.isNew=false;render();
  const s=$("sheet");s.innerHTML="";
  const h=document.createElement("h3");h.textContent=m.subject||"(no subject)";
  const me=document.createElement("div");me.className="meta";me.textContent="From "+m.fromFull+" · "+new Date(m.createdAt).toLocaleString();
  const p=document.createElement("pre");p.textContent="Loading…";
  s.append(h,me,p);$("modal").classList.add("show");
  try{
    const d=await api("/messages/"+m.id);
    const text=(d.text||d.intro||"").trim();
    const otp=findOtp(m.subject+" "+text);
    if(otp){const o=document.createElement("div");o.className="otp";o.innerHTML=otp+"<small>TAP TO COPY</small>";o.onclick=()=>copy(otp,"Code copied");s.insertBefore(o,p)}
    p.textContent="";
    text.split(/(https?:\/\/[^\s<>"')]+)/).forEach((part,i)=>{
      if(i%2){const a=document.createElement("a");a.href=part;a.target="_blank";a.rel="noopener noreferrer";a.textContent=part;p.append(a)}
      else p.append(document.createTextNode(part));
    });
  }catch(e){p.textContent=m.intro||"Could not load the message."}
}
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("show")};

async function fetchInbox(manual){
  if(!acc||!token)return;
  try{
    const d=await api("/messages");
    const list=(d["hydra:member"]||[]);
    let fresh=0;
    msgs=list.map(x=>{
      const old=msgs.find(o=>o.id===x.id);
      const isNew=old?old.isNew:!seen.has(x.id);
      if(!seen.has(x.id)){seen.add(x.id);fresh++}
      return{id:x.id,from:(x.from&&(x.from.name||x.from.address))||"Unknown",fromFull:(x.from&&x.from.address)||"",subject:x.subject,intro:x.intro,createdAt:x.createdAt,isNew};
    });
    render();setSt("Live");
    if(fresh&&!manual)toast("New message received");
    if(manual)toast("Inbox refreshed");
  }catch(e){setSt("Offline",true);if(manual)toast("Could not reach the mail server")}
}

async function gen(){
  if(busy)return;busy=true;
  clearInterval(poll);
  $("new").disabled=$("del").disabled=true;$("new").textContent="Generating…";setSt("Generating…");
  try{
    if(acc)await api("/accounts/"+acc.id,{method:"DELETE"}).catch(()=>{});
    let a,t,address,password,lastErr=null;
    for(const h of HOSTS){
      try{
        API=h;token="";
        const dm=await api("/domains");
        address=rnd(10)+"@"+dm["hydra:member"][0].domain;password=rnd(16);
        a=await api("/accounts",{method:"POST",body:JSON.stringify({address,password})});
        t=await api("/token",{method:"POST",body:JSON.stringify({address,password})});
        lastErr=null;break;
      }catch(e){lastErr=e}
    }
    if(lastErr)throw lastErr;
    acc={id:a.id,address,password,host:API};token=t.token;msgs=[];seen=new Set();
    store.set("tm_acc",JSON.stringify(acc));
    $("addr").textContent=address;render();startTimer();setSt("Live");
    toast("New email address generated.");
    poll=setInterval(()=>fetchInbox(false),5000);
  }catch(e){
    setSt("Offline",true);
    toast(e.name==="TypeError"?"Can’t reach the mail servers. Try other Wi‑Fi or mobile data, and turn off VPN, Private DNS or ad blocker.":e.message==="429"?"Too many requests, wait a few seconds and try again":"Mail server error ("+e.message+"). Try again in a moment.");
  }
  $("new").disabled=$("del").disabled=false;$("new").textContent="+ New Email";busy=false;
}
async function remove(){
  clearInterval(poll);clearInterval(tick);
  if(acc)api("/accounts/"+acc.id,{method:"DELETE"}).catch(()=>{});
  acc=null;token="";msgs=[];store.del("tm_acc");
  $("addr").textContent="No email yet";left=total;draw();render();setSt("Ready");toast("Address deleted");
}
async function restore(){
  const raw=store.get("tm_acc");if(!raw)return gen();
  try{
    acc=JSON.parse(raw);API=acc.host||HOSTS[0];
    const t=await api("/token",{method:"POST",body:JSON.stringify({address:acc.address,password:acc.password})});
    token=t.token;$("addr").textContent=acc.address;startTimer();await fetchInbox(true);
    poll=setInterval(()=>fetchInbox(false),5000);
  }catch(e){acc=null;token="";store.del("tm_acc");gen()}
}

$("new").onclick=gen;$("del").onclick=remove;
$("copy").onclick=()=>acc?copy(acc.address,"Copied to clipboard"):toast("Generate an address first");
$("ref").onclick=()=>{const b=$("ref");b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");fetchInbox(true)};
$("q").oninput=render;
$("dur").onchange=()=>{if(acc)startTimer();else{total=left=+$("dur").value;draw()}};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)fetchInbox(false)});
render();restore();
</script>
</body>
</html>
